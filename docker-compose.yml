services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: building_draft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d building_draft"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
