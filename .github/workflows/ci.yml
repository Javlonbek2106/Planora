name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      # Fails when the model changed but nobody added a migration.
      - run: dotnet tool restore
      - run: dotnet tool run dotnet-ef migrations has-pending-model-changes -p src/BuildingDraft.Infrastructure -s src/BuildingDraft.Api

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Includes the golden-file contract test with the backend (contracts/client_session.json).
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t building-draft-api .
      # Starts the image against a real PostgreSQL and waits until readiness reports healthy.
      - name: Smoke test the image
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=building_draft postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -d building_draft && break; sleep 2; done
          docker run -d --name api --network smoke -p 8080:8080 \
            -e ConnectionStrings__Default="Host=pg;Database=building_draft;Username=postgres;Password=postgres" \
            -e Database__MigrateOnStartup=true -e Auth__Mode=Jwt -e Auth__SigningKey="ci-only-signing-key-with-at-least-32-bytes" \
            building-draft-api
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/ready && break; sleep 2; done
          curl -fs http://localhost:8080/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/projects)" = "401"
          docker logs api
